name: Deploy site to GitHub Pages

on:
  push:
    branches: ["claude/zhuk-beetle-sales-site-f1k542"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Позволяваме само едно едновременно публикуване.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Включва GitHub Pages (build type = GitHub Actions), ако още не е включен.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Публикуваме само index.html (целият сайт е в един файл).
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
